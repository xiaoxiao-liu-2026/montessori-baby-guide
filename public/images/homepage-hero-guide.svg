<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="576" viewBox="0 0 1024 576" role="img" aria-labelledby="title desc">
  <title id="title">宝宝成长，妈妈不慌 0-3岁蒙氏成长指南</title>
  <desc id="desc">孩子在家中用小水壶倒水，妈妈在旁边安静观察的蒙氏生活练习场景。</desc>
  <defs>
    <linearGradient id="fade" x1="0" x2="0.72" y1="0" y2="0">
      <stop offset="0" stop-color="#F7F9F6" stop-opacity="0.96"/>
      <stop offset="0.42" stop-color="#F7F9F6" stop-opacity="0.86"/>
      <stop offset="0.7" stop-color="#F7F9F6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F7F9F6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soften">
      <feGaussianBlur stdDeviation="0.12"/>
    </filter>
  </defs>
  <rect width="1024" height="576" fill="#F7F9F6"/>
  <image href="/images/montessori-hero-pouring.png" width="1024" height="576" preserveAspectRatio="xMidYMid slice" filter="url(#soften)"/>
  <rect width="1024" height="576" fill="url(#fade)"/>
  <text x="56" y="266" font-family="'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', serif" font-size="36" font-weight="600" fill="#111613">
    《宝宝成长，妈妈不慌》
  </text>
  <text x="74" y="328" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="600" fill="#111613">
    0-3岁蒙氏成长指南
  </text>
</svg>
